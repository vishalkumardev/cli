name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-tag:
    name: Determine Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Tag Release (if on main branch)
        id: tagger
        if: !startsWith(github.ref, 'refs/tags/')
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: main

      - name: Set Tag Output
        id: get_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ steps.tagger.outputs.new_tag }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Release tag is: ${TAG_NAME}"

  build-and-publish:
    name: Build & Package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: create-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            archive_ext: zip
          - goos: windows
            goarch: arm64
            archive_ext: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.create-tag.outputs.tag }}
        run: |
          BINARY_NAME="buildshare"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="buildshare.exe"
          fi
          mkdir -p dist
          go build -ldflags "-s -w -X 'github.com/buildshare/cli/cmd/buildshare.Version=${VERSION}'" -o "dist/${BINARY_NAME}" ./main.go

      - name: Create Package Archive
        run: |
          TAG="${{ needs.create-tag.outputs.tag }}"
          ARCHIVE_NAME="buildshare_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${ARCHIVE_NAME}.zip" buildshare.exe
          else
            tar -czvf "../${ARCHIVE_NAME}.tar.gz" buildshare
          fi
          cd ..
          ls -la buildshare_*

      - name: Upload Binary Package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          files: buildshare_*.*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
