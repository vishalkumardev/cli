name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # STAGE 1 — Determine version, create the GitHub Release entry once
  # ──────────────────────────────────────────────────────────────────
  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed for git describe

      - name: Compute Next Version Tag
        id: version
        run: |
          # If this run was triggered by an explicit tag push, use that tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Triggered by tag push: ${TAG}"
          else
            # Find the latest existing semver tag (vX.Y.Z)
            LATEST=$(git tag -l 'v*' | sort -V | tail -n 1)

            if [ -z "${LATEST}" ]; then
              # No tags yet — start at v0.1.0
              TAG="v0.1.0"
            else
              # Strip 'v' prefix, split on dots, bump patch
              VERSION="${LATEST#v}"
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
            echo "Auto-bumped tag: ${TAG}"

            # Create and push the new tag
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG} [automated]"
            git push origin "${TAG}"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release Entry
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # STAGE 2 — One job per platform, all run in parallel after Stage 1
  # ──────────────────────────────────────────────────────────────────
  build-darwin-arm64:
    name: 🍏 macOS (Apple Silicon / arm64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
          go build -ldflags "-s -w -X 'github.com/buildshare/cli/cmd/buildshare.Version=${{ needs.create-release.outputs.tag }}'" \
            -o dist/buildshare ./main.go
          tar -czvf buildshare_${{ needs.create-release.outputs.tag }}_darwin_arm64.tar.gz -C dist buildshare
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: buildshare_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-darwin-amd64:
    name: 🍎 macOS (Intel / amd64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
          go build -ldflags "-s -w -X 'github.com/buildshare/cli/cmd/buildshare.Version=${{ needs.create-release.outputs.tag }}'" \
            -o dist/buildshare ./main.go
          tar -czvf buildshare_${{ needs.create-release.outputs.tag }}_darwin_amd64.tar.gz -C dist buildshare
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: buildshare_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-amd64:
    name: 🐧 Linux (amd64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
          go build -ldflags "-s -w -X 'github.com/buildshare/cli/cmd/buildshare.Version=${{ needs.create-release.outputs.tag }}'" \
            -o dist/buildshare ./main.go
          tar -czvf buildshare_${{ needs.create-release.outputs.tag }}_linux_amd64.tar.gz -C dist buildshare
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: buildshare_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    name: 🐧 Linux (arm64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
          go build -ldflags "-s -w -X 'github.com/buildshare/cli/cmd/buildshare.Version=${{ needs.create-release.outputs.tag }}'" \
            -o dist/buildshare ./main.go
          tar -czvf buildshare_${{ needs.create-release.outputs.tag }}_linux_arm64.tar.gz -C dist buildshare
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: buildshare_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-amd64:
    name: 🪟 Windows (amd64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
          go build -ldflags "-s -w -X 'github.com/buildshare/cli/cmd/buildshare.Version=${{ needs.create-release.outputs.tag }}'" \
            -o dist/buildshare.exe ./main.go
          cd dist && zip ../buildshare_${{ needs.create-release.outputs.tag }}_windows_amd64.zip buildshare.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: buildshare_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-arm64:
    name: 🪟 Windows (arm64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
          go build -ldflags "-s -w -X 'github.com/buildshare/cli/cmd/buildshare.Version=${{ needs.create-release.outputs.tag }}'" \
            -o dist/buildshare.exe ./main.go
          cd dist && zip ../buildshare_${{ needs.create-release.outputs.tag }}_windows_arm64.zip buildshare.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: buildshare_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
